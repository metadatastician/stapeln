# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
#
# The 122 ExUnit tests in backend/ gated NOTHING on GitHub until this existed.
# `mix test` appeared only in .gitlab-ci.yml, while GitHub is the forge that
# gates merges here — so the largest test suite in the repo was decorative.
#
# Action refs are TAGS, and must stay tags. MEASURED: pinning them to inline
# SHAs while actions.lock records the tag form makes GitHub reject this
# workflow outright -- `Backend Tests` came back startup_failure, the same
# zero-job rejection that the codeql v4.37.3/v4.37.6 drift produced. The
# lockfile is the pin, and it resolves these tags to immutable SHAs.
#
# SonarCloud's githubactions:S7637 wants inline SHAs and is not lockfile-aware,
# so it flags this file. That finding is a false positive here and is
# documented in .sonarcloud.properties; it needs a one-click false-positive
# marking in the SonarCloud UI, which cannot be done from the repo.
name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mix-test:
    name: mix test (Elixir backend)
    runs-on: ubuntu-latest
    # Legal here: this is a `steps:` job, not a `uses:` reusable-workflow call.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      # Versions match the toolchain the suite is developed against
      # (Elixir 1.18.3 / OTP 27.3.4.1) rather than "latest", so a green run
      # here means the same thing as a green run locally.
      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: '1.18.3'
          otp-version: '27.3.4.1'

      - name: Fetch dependencies
        run: mix deps.get
        working-directory: backend

      - name: Run tests
        run: mix test
        working-directory: backend
