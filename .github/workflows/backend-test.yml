# This workflow is managed by gh actions-lock.
#
# The 122 ExUnit tests in backend/ gated NOTHING on GitHub until this existed.
# `mix test` appeared only in .gitlab-ci.yml, while GitHub is the forge that
# gates merges here — so the largest test suite in the repo was decorative.
#
# Actions are pinned to full commit SHAs with the tag in a trailing comment.
# Both forms coexist with .github/workflows/actions.lock (verified: `gh
# actions-lock` reports all workflows valid with these SHAs recorded), and the
# SHA form is what SonarCloud's security rating requires.
name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mix-test:
    name: mix test (Elixir backend)
    runs-on: ubuntu-latest
    # Legal here: this is a `steps:` job, not a `uses:` reusable-workflow call.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      # Versions match the toolchain the suite is developed against
      # (Elixir 1.18.3 / OTP 27.3.4.1) rather than "latest", so a green run
      # here means the same thing as a green run locally.
      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: '1.18.3'
          otp-version: '27.3.4.1'

      - name: Fetch dependencies
        run: mix deps.get
        working-directory: backend

      - name: Run tests
        run: mix test
        working-directory: backend
