# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
name: OSSF Scorecard

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write
  security-events: write

jobs:
  scorecard:
    uses: hyperpolymath/standards/.github/workflows/scorecard-reusable.yml@892497fe373744874316710966b81ae6f0ea9e66
    permissions:
      # `actions: read` is REQUIRED here, not redundant. A job-level permissions
      # block REPLACES the workflow-level one for that job; the reusable workflow
      # requests `actions: read`, so omitting it made the call a permission
      # ESCALATION, which GitHub rejects before any job starts. That is why this
      # workflow produced a zero-job `startup_failure` every day -- a failure mode
      # `gh pr checks` does not surface, because a rejected workflow has no checks.
      actions: read
      contents: read
      security-events: write
      id-token: write
