# This workflow is managed by gh actions-lock.
name: Secret Scanner

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    # `contents: read` is the whole grant, because it is the whole requirement.
    #
    # The reusable declares `workflow_call.secrets` NONE, has no `${{ secrets.* }}`
    # reference, and every one of its three jobs (gitleaks, rust-secrets,
    # shell-secrets) declares `permissions: contents: read` explicitly. gitleaks
    # runs as a pinned checksum-verified binary, not `gitleaks/gitleaks-action`,
    # so nothing here needs `pull-requests: write` (which was asserted here as a
    # claim about a PR summary comment the callee no longer posts) and nothing
    # needs `actions: read`. A job-level `permissions:` block REPLACES, never
    # merges with, the workflow-level one — so with `actions: read` at the top
    # and this job narrowed, the callee would be granted `contents: read` only
    # and the run startup-fails with no check run at all.
    #
    # Verified against the callee at this exact pin:
    #   .github/workflows/secret-scanner-reusable.yml@7641c7fd
    permissions:
      contents: read
    # NO `secrets:` line. `secrets: inherit` would forward every repository and
    # organisation secret the caller can see (CWE-250) for a callee that
    # declares none (standards#1108 §6b).
    #
    # The pin is the estate's runtime-validated scanner revision. #89 moved this
    # caller from `hyperpolymath/standards` to `metadatastician/standards` but
    # kept the OLD `b8f60511`, which does not carry the inputs this file is
    # entitled to rely on; the validated pair used by the rest of the fleet is
    # `metadatastician/standards@7641c7fd`. See the runtime-validation comment in
    # .github/workflows/hypatia-scan.yml for how that was established.
    uses: metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@7641c7fdb01420696b5420ab85d88f599f32f609
