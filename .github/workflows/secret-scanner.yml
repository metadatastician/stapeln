# SPDX-License-Identifier: PMPL-1.0-or-later
# Prevention workflow - scans for hardcoded secrets before they reach main
name: Secret Scanner

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
        with:
          fetch-depth: 0  # Full history for scanning

      # The trufflehog GitHub Action runs in git-diff mode and exits non-zero
      # with "BASE and HEAD commits are the same" on several event shapes
      # (fresh branch push, single-commit PR), failing the job even when no
      # secret exists. Invoke the pinned CLI directly for a deterministic
      # full-history scan that only fails on a *verified* finding.
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@37b77001d0174ebec2fcca2bd83ff83a6d45a3ab # v3.95.3
        with:
          # Scan the full checked-out history (fetch-depth: 0 above) rather
          # than an event-derived base..head range. The old pin failed every
          # run with "BASE and HEAD commits are the same" on push-to-main and
          # on PRs (empty/degenerate diff range) — a wrapper bug, not a real
          # finding (a full-tree scan reports zero secrets). An empty `base`
          # makes the scan deterministic and only fails on verified secrets.
          base: ""
          extra_args: --only-verified

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Rust-specific: Check for hardcoded crypto values
  rust-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Check for hardcoded secrets in Rust
        run: |
          if ! find . -name Cargo.toml -not -path './target/*' -print -quit | grep -q .; then
            echo 'No Cargo.toml found — skipping Rust secrets check'
            exit 0
          fi
          # Patterns that suggest hardcoded secrets
          PATTERNS=(
            'const.*SECRET.*=.*"'
            'const.*KEY.*=.*"[a-zA-Z0-9]{16,}"'
            'const.*TOKEN.*=.*"'
            'let.*api_key.*=.*"'
            'HMAC.*"[a-fA-F0-9]{32,}"'
            'password.*=.*"[^"]+"'
          )

          found=0
          for pattern in "${PATTERNS[@]}"; do
            if grep -rn --include="*.rs" -E "$pattern" src/; then
              echo "WARNING: Potential hardcoded secret found matching: $pattern"
              found=1
            fi
          done

          if [ $found -eq 1 ]; then
            echo "::error::Potential hardcoded secrets detected. Use environment variables instead."
            exit 1
          fi
