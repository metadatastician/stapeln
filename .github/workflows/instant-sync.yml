# This workflow is managed by gh actions-lock.
# Instant Forge Sync - Triggers propagation to all forges on push/release
name: Instant Sync

on:
  push:
    branches: [main, master]
  release:
    types: [published]

permissions:
  actions: read
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ⚠ The `secrets` context is NOT available in a job-level `if:` — a
    # workflow that tries it is REJECTED BEFORE ANY JOB IS CREATED, giving a
    # startup_failure with no log and no check run. That silently killed CI in
    # 51 estate repositories. Surfacing the token as env lets the step below
    # test for it in a form that is valid.
    env:
      FARM_DISPATCH_TOKEN: ${{ secrets.FARM_DISPATCH_TOKEN }}

    steps:
      - name: Trigger Propagation
        # Without this the action runs with an empty token and fails with an
        # opaque auth error on every fork and wherever the secret is unset.
        if: env.FARM_DISPATCH_TOKEN != ''
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.FARM_DISPATCH_TOKEN }}
          repository: hyperpolymath/.git-private-farm
          event-type: propagate
          client-payload: |-
            {
              "repo": "${{ github.event.repository.name }}",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "forges": ""
            }

      - name: Confirm
        run: echo "::notice::Propagation triggered for ${{ github.event.repository.name }}"
