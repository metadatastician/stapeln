# This workflow is managed by gh actions-lock.
# Instant Forge Sync - Triggers propagation to all forges on push/release
name: Instant Sync

on:
  push:
    branches: [main, master]
  release:
    types: [published]

permissions:
  actions: read
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Map the secret to an env var so the step below can gate on its
    # presence: the `secrets` context is not available in a step `if:`,
    # but `env` is.
    env:
      FARM_DISPATCH_TOKEN: ${{ secrets.FARM_DISPATCH_TOKEN }}
    steps:
      - name: Trigger Propagation
        # Skip cleanly when the token is absent (forks, or before the
        # secret is configured) instead of invoking the action and failing.
        if: env.FARM_DISPATCH_TOKEN != ''
        uses: peter-evans/repository-dispatch@v4.0.1
        with:
          token: ${{ secrets.FARM_DISPATCH_TOKEN }}
          repository: hyperpolymath/.git-private-farm
          event-type: propagate
          client-payload: |-
            {
              "repo": "${{ github.event.repository.name }}",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "forges": ""
            }

      - name: Confirm
        run: echo "::notice::Propagation triggered for ${{ github.event.repository.name }}"
