# This workflow is managed by gh actions-lock.
name: BoJ Server Build Trigger
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  trigger-boj:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Trigger BoJ Server (Casket/ssg-mcp)
        env:
          # `github.ref_name` and `github.repository` are attacker-influenced: on a
          # pull request from a fork, `ref_name` is a branch name its author chose.
          # Interpolating them directly into a `run:` block splices that text into
          # shell source (zizmor `template-injection`, high confidence). Routed
          # through `env:` the shell sees them only as data.
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Send a secure trigger to boj-server to build this repository
          payload=$(jq -cn --arg repo "$REPO" --arg branch "$BRANCH" \
            '{repo: $repo, branch: $branch, engine: "casket"}')
          curl -X POST "http://boj-server.local:7700/cartridges/ssg-mcp/invoke" \
            -H "Content-Type: application/json" \
            -d "$payload"
        continue-on-error: true
permissions:
  actions: read
  contents: read
