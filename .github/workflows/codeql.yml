# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
name: CodeQL Security Analysis
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 1 * *'   # monthly 1st 06:00 UTC (Actions burn cut, standards#288)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default to `actions` — scaffolded repos rarely have JS/TS
          # source; `javascript-typescript` produced "no source files"
          # failures on every CodeQL run. The `actions` extractor scans
          # workflow files which every repo has. Override per-repo if
          # the scaffolded project actually contains JS/TS code.
          # Per hypatia rule `codeql_language_matrix_mismatch`.
          - language: actions
            build-mode: none
    steps:
      # `persist-credentials: false` is the security control here: the token is
      # only needed to fetch the source, and leaving it in .git/config lets any
      # later step — or any compromised build script — push as this job.
      #
      # Each ref is an immutable commit; the `#` comment is the lockfile KEY for
      # that commit, not decoration. tests/unit/ci_configuration_test.ts uses
      # those comments to look the commit up in .github/workflows/actions.lock
      # and asserts the two agree, so the comment and the lockfile must be
      # updated together with the SHA. Note the previous comments here read
      # `# v3` while pinning v4 commits, and the lockfile still recorded
      # v4.38.0: a workflow whose refs disagree with its lockfile is rejected
      # by GitHub before any job starts ("Invalid lockfile"), which is how the
      # CodeQL scanner ended up not running at all with no failing check to
      # show for it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:${{ matrix.language }}"
