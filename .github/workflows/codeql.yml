# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
name: CodeQL Security Analysis
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 1 * *'   # monthly 1st 06:00 UTC (Actions burn cut, standards#288)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default to `actions` — scaffolded repos rarely have JS/TS
          # source; `javascript-typescript` produced "no source files"
          # failures on every CodeQL run. The `actions` extractor scans
          # workflow files which every repo has. Override per-repo if
          # the scaffolded project actually contains JS/TS code.
          # Per hypatia rule `codeql_language_matrix_mismatch`.
          - language: actions
            build-mode: none
    steps:
      # `persist-credentials: false` is the security control here: the token is
      # only needed to fetch the source, and leaving it in .git/config lets any
      # later step — or any compromised build script — push as this job.
      #
      # These refs are TAGS, not SHAs, on purpose. This repository has an
      # actions.lock, and the lockfile is the pin authority: it records the
      # immutable commit behind every ref below.
      #
      #   actions/checkout      -> sha1-3d3c42e5aac5ba805825da76410c181273ba90b1
      #   github/codeql-action  -> sha1-1c5b675653bb5c22dbe9b12b556ec555138e09fd
      #
      # Re-inlining those SHAs here is what kept this workflow dead. GitHub
      # validates actions.lock against what the workflows actually reference, so
      # inline SHAs made the lockfile disagree with the file and GitHub refused
      # to start the workflow at all:
      #
      #   Invalid lockfile: .github/workflows/actions.lock#L1
      #   The lockfile could not be validated.
      #
      # A rejected workflow reports `startup_failure` and produces NO checks, so
      # the security scanner being off never appeared as a red check. oikosbot.yml
      # (tag refs) recovered the moment the lock was resynced; this workflow did
      # not, which is what isolated the inline-SHA form as the remaining cause.
      # This is the same rule progblocks records in its AGENTS.md ("do not
      # re-inline action SHAs that .github/workflows/actions.lock already owns")
      # and the same NOSONAR pin-authority convention already used in
      # oikosbot.yml and dogfood-gate.yml here.
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.1
        with:
          category: "/language:${{ matrix.language }}"
