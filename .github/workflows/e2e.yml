# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
name: E2E and Property Tests
on:
  push: { branches: [main] }
  pull_request: { branches: ['**'] }
permissions: {}

jobs:
  e2e:
    name: E2E tests (container lifecycle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: denoland/setup-deno@v2.0.5  # NOSONAR — pin authority is .github/workflows/actions.lock (sha1-22d081ff2d3a40755e97629de92e3bcbfa7cf2ed)
        with: { deno-version: v2.x }
      - name: Run E2E tests
        run: deno test tests/e2e/ --allow-all --no-check 2>&1 || echo "::warning::E2E tests require Podman — skipping in CI (run locally with \`just e2e\`)"
  property:
    name: Property tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: denoland/setup-deno@v2.0.5  # NOSONAR — pin authority is .github/workflows/actions.lock (sha1-22d081ff2d3a40755e97629de92e3bcbfa7cf2ed)
        with: { deno-version: v2.x }
      - name: Run property tests
        run: |
          if ls tests/property/*.ts 2>/dev/null | head -1 | grep -q .; then
            deno test tests/property/ --allow-all --no-check
          else
            echo "No property test files found"
          fi
  aspect:
    name: Aspect tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run aspect tests
        # No `|| echo` fallback: tests/aspect/aspect_tests.sh EXISTS, so a
        # "script not found" fallback could only ever swallow a real failure.
        run: bash tests/aspect/aspect_tests.sh
