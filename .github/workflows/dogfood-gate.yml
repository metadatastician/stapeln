#
# dogfood-gate.yml — Hyperpolymath Dogfooding Quality Gate
# Validates that the repo uses hyperpolymath's own formats and tools.
# Companion to static-analysis-gate.yml (security) — this is for format compliance.
name: Dogfood Gate

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, master]

permissions:
  actions: read
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: A2ML manifest validation
  # ---------------------------------------------------------------------------
  a2ml-validate:
    name: Validate A2ML manifests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Check for A2ML files
        id: detect
        run: |
          COUNT=$(find . -name '*.a2ml' -not -path './.git/*' | wc -l)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::No .a2ml manifest files found. Every RSR repo should have 0-AI-MANIFEST.a2ml"
          fi

      # Re-adopted the external action: the comment-newline corruption that
      # forced the vendored copy was repaired upstream in
      # hyperpolymath/a2ml-validate-action#11 (f8517bb). That HEAD is now
      # byte-equivalent in logic to the vendored script (verified by diff),
      # and the same paths-ignore carve-out keeps stapeln green. Resolves #44.
      - name: Validate A2ML manifests
        if: steps.detect.outputs.count > 0
        uses: hyperpolymath/a2ml-ecosystem/validate-action@main
        with:
          path: '.'
          strict: 'false'
          # Default carve-outs plus stapeln's legitimately distinct A2ML
          # doc-types whose identity is structural, not a TOML name/version
          # pair: clade declarations, YAML anchor files, agent-instruction
          # session configs, and Guile s-expression classification registries
          # (audits/*.a2ml). Same rationale as the action's built-in defaults
          # (hyperpolymath/hypatia#243 — distinguish doc type from target).
          paths-ignore: |
            vendor/
            vendored/
            verified-container-spec/
            .audittraining/
            integration/fixtures/
            test/fixtures/
            tests/fixtures/
            .machine_readable/agent_instructions/
            .machine_readable/CLADE.a2ml
            .machine_readable/anchors/
            audits/assail-classifications.a2ml

      - name: Write summary
        run: |
          A2ML_COUNT="${{ steps.detect.outputs.count }}"
          if [ "$A2ML_COUNT" -eq 0 ]; then
            cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## A2ML Validation

          :warning: **No .a2ml files found.** Every RSR-compliant repo should have at least `0-AI-MANIFEST.a2ml`.

          Create one with: `a2mliser init` or copy from [rsr-template-repo](https://github.com/hyperpolymath/rsr-template-repo).
          EOF
          else
            echo "## A2ML Validation" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Scanned **${A2ML_COUNT}** .a2ml file(s). See step output for details." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # Job 2: K9 contract validation
  # ---------------------------------------------------------------------------
  k9-validate:
    name: Validate K9 contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Check for K9 files
        id: detect
        run: |
          COUNT=$(find . \( -name '*.k9' -o -name '*.k9.ncl' \) -not -path './.git/*' | wc -l)
          CONFIG_COUNT=$(find . \( -name '*.toml' -o -name '*.yaml' -o -name '*.yml' -o -name '*.json' \) \
            -not -path './.git/*' -not -path './node_modules/*' -not -path './.deno/*' \
            -not -name 'package-lock.json' -not -name 'Cargo.lock' -not -name 'deno.lock' | wc -l)
          echo "k9_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "config_count=$CONFIG_COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ] && [ "$CONFIG_COUNT" -gt 0 ]; then
            echo "::warning::Found $CONFIG_COUNT config files but no K9 contracts. Run k9iser to generate contracts."
          fi

      - name: Validate K9 contracts
        if: steps.detect.outputs.k9_count > 0
        uses: hyperpolymath/k9-ecosystem/validate-action@main
        with:
          path: '.'
          strict: 'false'

      - name: Write summary
        run: |
          K9_COUNT="${{ steps.detect.outputs.k9_count }}"
          CFG_COUNT="${{ steps.detect.outputs.config_count }}"
          if [ "$K9_COUNT" -eq 0 ]; then
            cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## K9 Contract Validation

          :warning: **No K9 contract files found.** Repos with configuration files should have K9 contracts.

          Generate contracts with: `k9iser generate .`
          EOF
          else
            echo "## K9 Contract Validation" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Validated **${K9_COUNT}** K9 contract(s) against **${CFG_COUNT}** config file(s)." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # Job 3: Empty-linter — invisible character detection
  # ---------------------------------------------------------------------------
  empty-lint:
    name: Empty-linter (invisible characters)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Scan for invisible characters
        id: lint
        run: |
          # Inline invisible character detection (from empty-linter's core patterns).
          # Checks for: zero-width spaces, zero-width joiners, BOM, soft hyphens,
          # non-breaking spaces, null bytes, and other invisible Unicode in source files.
          #
          # Pattern form matters, and this is the bug being fixed. In a UTF-8 locale
          # `grep -P` reads \xc2 as CODEPOINT U+00C2, not as a byte, so the byte-sequence
          # form '\xc2\xa0' never matches a real NBSP (U+00A0) and the scan reports a
          # clean tree no matter what is in it. Measured on GNU grep 3.11 and ugrep
          # 7.8.4: byte form 0 matches, codepoint form '\x{a0}' 1 match. Use \x{...}.
          #
          # The BOM pass below is a SECOND, byte-level instrument because grep
          # implementations disagree about a BOM at byte 0: GNU grep 3.11 matches
          # \x{feff} there, ugrep 7.8.4 strips the BOM first and cannot. Runners ship
          # GNU grep today, so this pass is currently redundant -- it is here so the
          # gate stays correct if that ever changes, and so the annotation names the
          # actual defect instead of "some invisible character".
          set +e
          PATTERNS='\x00|[\x01-\x08\x0B\x0C\x0E-\x1F]|\x{a0}|\x{ad}|\x{200b}|\x{200c}|\x{200d}|\x{200e}|\x{200f}|\x{202a}|\x{202b}|\x{202c}|\x{202d}|\x{202e}|\x{2060}|\x{feff}'

          # POSITIVE CONTROL. A clean tree and a broken scanner emit identical output,
          # so a bare zero is not evidence -- that is exactly how the previous pattern
          # went unnoticed. Plant fixtures outside the workspace and prove each
          # instrument moves before trusting anything below. Deliberately does NOT
          # assert that the pattern pass catches a leading BOM, since that is the one
          # behaviour grep implementations differ on.
          CTL="$RUNNER_TEMP/empty-lint-control"
          rm -rf "$CTL" && mkdir -p "$CTL"
          printf 'a\xe2\x80\x8bb\n' > "$CTL/zwsp.txt"
          printf '\xef\xbb\xbf{}\n' > "$CTL/bom.txt"
          printf 'plain\n'          > "$CTL/clean.txt"
          CTL_FAIL=0
          grep -aPq "$PATTERNS" "$CTL/zwsp.txt" \
            || { echo "::error::self-test: pattern pass MISSED a planted zero-width space"; CTL_FAIL=1; }
          grep -aPq "$PATTERNS" "$CTL/clean.txt" \
            && { echo "::error::self-test: pattern pass matched a CLEAN file"; CTL_FAIL=1; }
          [ "$(head -c3 "$CTL/bom.txt" | od -An -tx1 | tr -d ' \n')" = "efbbbf" ] \
            || { echo "::error::self-test: BOM pass MISSED a planted leading BOM"; CTL_FAIL=1; }
          [ "$(head -c3 "$CTL/clean.txt" | od -An -tx1 | tr -d ' \n')" = "efbbbf" ] \
            && { echo "::error::self-test: BOM pass matched a CLEAN file"; CTL_FAIL=1; }
          if [ "$CTL_FAIL" -ne 0 ]; then
            echo "::error::Empty-linter self-test failed -- the scan below cannot be trusted."
            exit 1
          fi
          echo "Self-test passed: both instruments fire on planted fixtures and stay quiet on a clean one."

          find "$GITHUB_WORKSPACE" \
            -not -path '*/.git/*' -not -path '*/node_modules/*' \
            -not -path '*/.deno/*' -not -path '*/target/*' \
            -not -path '*/_build/*' -not -path '*/deps/*' \
            -not -path '*/external_corpora/*' -not -path '*/.lake/*' \
            -type f \( -name '*.rs' -o -name '*.ex' -o -name '*.exs' -o -name '*.res' \
              -o -name '*.js' -o -name '*.ts' -o -name '*.json' -o -name '*.toml' \
              -o -name '*.yml' -o -name '*.yaml' -o -name '*.md' -o -name '*.adoc' \
              -o -name '*.idr' -o -name '*.zig' -o -name '*.v' -o -name '*.jl' \
              -o -name '*.gleam' -o -name '*.hs' -o -name '*.ml' -o -name '*.sh' \) \
            -print0 > "$RUNNER_TEMP/empty-lint-candidates.zero" 2>/dev/null

          : > "$RUNNER_TEMP/empty-lint-pattern.txt"
          : > "$RUNNER_TEMP/empty-lint-bom.txt"

          # Pass 1 -- invisible codepoints anywhere in the file.
          xargs -0 -r grep -aPl "$PATTERNS" < "$RUNNER_TEMP/empty-lint-candidates.zero" \
            > "$RUNNER_TEMP/empty-lint-pattern.txt" 2>/dev/null

          # Pass 2 -- BOM at byte 0, read as bytes.
          while IFS= read -r -d '' f; do
            [ -z "$f" ] && continue
            if [ "$(head -c3 "$f" | od -An -tx1 | tr -d ' \n')" = "efbbbf" ]; then
              printf '%s\n' "$f" >> "$RUNNER_TEMP/empty-lint-bom.txt"
            fi
          done < "$RUNNER_TEMP/empty-lint-candidates.zero"
          set -e

          # The two passes OVERLAP -- under GNU grep a BOM'd file appears in both --
          # so the finding count is the union, not the sum. LC_ALL=C on every sort and
          # comm so both sides use the same collation.
          LC_ALL=C sort -u "$RUNNER_TEMP/empty-lint-pattern.txt" > "$RUNNER_TEMP/p.sorted"
          LC_ALL=C sort -u "$RUNNER_TEMP/empty-lint-bom.txt"     > "$RUNNER_TEMP/b.sorted"
          LC_ALL=C comm -23 "$RUNNER_TEMP/p.sorted" "$RUNNER_TEMP/b.sorted" > "$RUNNER_TEMP/p.only"
          LC_ALL=C sort -u "$RUNNER_TEMP/p.sorted" "$RUNNER_TEMP/b.sorted"  > "$RUNNER_TEMP/all.sorted"

          CANDIDATES=$(tr -cd '\0' < "$RUNNER_TEMP/empty-lint-candidates.zero" | wc -c | tr -d ' ')
          PATTERN_HITS=$(wc -l < "$RUNNER_TEMP/p.sorted" | tr -d ' ')
          BOM_HITS=$(wc -l < "$RUNNER_TEMP/b.sorted" | tr -d ' ')
          FINDINGS=$(wc -l < "$RUNNER_TEMP/all.sorted" | tr -d ' ')

          {
            echo "findings=$FINDINGS"
            echo "pattern_hits=$PATTERN_HITS"
            echo "bom_hits=$BOM_HITS"
            echo "candidates=$CANDIDATES"
            echo "ready=true"
          } >> "$GITHUB_OUTPUT"
          echo "Scanned $CANDIDATES in-scope file(s): $FINDINGS affected ($PATTERN_HITS by codepoint scan, $BOM_HITS by BOM check; a BOM'd file can appear in both)."

          while IFS= read -r filepath; do
            [ -z "$filepath" ] && continue
            REL_PATH="${filepath#"$GITHUB_WORKSPACE"/}"
            echo "::error file=${REL_PATH}::Invisible Unicode character (zero-width space/joiner, NBSP, soft hyphen, control char, or mid-file BOM)"
          done < "$RUNNER_TEMP/p.only"

          while IFS= read -r filepath; do
            [ -z "$filepath" ] && continue
            REL_PATH="${filepath#"$GITHUB_WORKSPACE"/}"
            echo "::error file=${REL_PATH}::UTF-8 BOM at byte 0 -- strip it"
          done < "$RUNNER_TEMP/b.sorted"

          # The gate must be able to fail. stapeln's tree is clean at this commit
          # (plant-verified 0 -> 1 -> 0 across 614 in-scope files), so this is
          # satisfiable today rather than aspirational.
          if [ "$FINDINGS" -gt 0 ]; then
            echo "::error::Empty-linter: $FINDINGS file(s) contain invisible characters."
            exit 1
          fi

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Empty-Linter Results"
            echo ""
            if [ "${{ steps.lint.outputs.ready }}" = "true" ]; then
              CANDIDATES="${{ steps.lint.outputs.candidates }}"
              FINDINGS="${{ steps.lint.outputs.findings }}"
              PATTERN_HITS="${{ steps.lint.outputs.pattern_hits }}"
              BOM_HITS="${{ steps.lint.outputs.bom_hits }}"
              echo "Scanned **${CANDIDATES}** in-scope file(s) with two instruments, both self-tested against planted fixtures on this run."
              echo ""
              if [ "$FINDINGS" -gt 0 ] 2>/dev/null; then
                echo ":x: **${FINDINGS}** file(s) contain invisible characters -- ${PATTERN_HITS} flagged by the codepoint scan, ${BOM_HITS} by the BOM check. See annotations above."
              else
                echo ":white_check_mark: No invisible character issues found."
              fi
            else
              echo ":x: The scan did not complete -- see the failed step above. This is **not** a clean result."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Job 4: Groove manifest check (for repos that should expose services)
  # ---------------------------------------------------------------------------
  groove-check:
    name: Groove manifest check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Check for Groove manifest
        id: groove
        run: |
          # Check for static or dynamic Groove endpoints
          HAS_MANIFEST="false"
          HAS_GROOVE_CODE="false"

          if [ -f ".well-known/groove/manifest.json" ]; then
            HAS_MANIFEST="true"
            # Validate the manifest JSON
            if ! jq empty .well-known/groove/manifest.json 2>/dev/null; then
              echo "::error file=.well-known/groove/manifest.json::Invalid JSON in Groove manifest"
            else
              SVC_ID=$(jq -r '.service_id // "unknown"' .well-known/groove/manifest.json)
              echo "service_id=$SVC_ID" >> "$GITHUB_OUTPUT"
            fi
          fi

          # Check for Groove endpoint code (Rust, Elixir, Zig, V)
          if grep -rl 'well-known/groove' --include='*.rs' --include='*.ex' --include='*.zig' --include='*.v' --include='*.res' . 2>/dev/null | head -1 | grep -q .; then
            HAS_GROOVE_CODE="true"
          fi

          # Check if this repo likely serves HTTP (has server/listener code)
          HAS_SERVER="false"
          if grep -rl 'TcpListener\|Bandit\|Plug.Cowboy\|httpz\|vweb\|axum::serve\|actix_web' --include='*.rs' --include='*.ex' --include='*.zig' --include='*.v' . 2>/dev/null | head -1 | grep -q .; then
            HAS_SERVER="true"
          fi

          echo "has_manifest=$HAS_MANIFEST" >> "$GITHUB_OUTPUT"
          echo "has_groove_code=$HAS_GROOVE_CODE" >> "$GITHUB_OUTPUT"
          echo "has_server=$HAS_SERVER" >> "$GITHUB_OUTPUT"

          if [ "$HAS_SERVER" = "true" ] && [ "$HAS_MANIFEST" = "false" ] && [ "$HAS_GROOVE_CODE" = "false" ]; then
            echo "::warning::This repo has server code but no Groove endpoint. Add .well-known/groove/manifest.json for service discovery."
          fi

      - name: Write summary
        run: |
          echo "## Groove Protocol Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Static manifest (.well-known/groove/manifest.json) | ${{ steps.groove.outputs.has_manifest }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Groove endpoint in code | ${{ steps.groove.outputs.has_groove_code }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Has HTTP server code | ${{ steps.groove.outputs.has_server }} |" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Job 5: Dogfooding summary
  # ---------------------------------------------------------------------------
  dogfood-summary:
    name: Dogfooding compliance summary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [a2ml-validate, k9-validate, empty-lint, groove-check]
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Generate dogfooding scorecard
        run: |
          SCORE=0
          MAX=5

          # A2ML manifest present?
          if find . -name '*.a2ml' -not -path './.git/*' | head -1 | grep -q .; then
            SCORE=$((SCORE + 1))
            A2ML_STATUS=":white_check_mark:"
          else
            A2ML_STATUS=":x:"
          fi

          # K9 contracts present?
          if find . \( -name '*.k9' -o -name '*.k9.ncl' \) -not -path './.git/*' | head -1 | grep -q .; then
            SCORE=$((SCORE + 1))
            K9_STATUS=":white_check_mark:"
          else
            K9_STATUS=":x:"
          fi

          # .editorconfig present?
          if [ -f ".editorconfig" ]; then
            SCORE=$((SCORE + 1))
            EC_STATUS=":white_check_mark:"
          else
            EC_STATUS=":x:"
          fi

          # Groove manifest or code?
          if [ -f ".well-known/groove/manifest.json" ] || grep -rl 'well-known/groove' --include='*.rs' --include='*.ex' --include='*.zig' . 2>/dev/null | head -1 | grep -q .; then
            SCORE=$((SCORE + 1))
            GROOVE_STATUS=":white_check_mark:"
          else
            GROOVE_STATUS=":ballot_box_with_check:"
          fi

          # VeriSimDB integration?
          if grep -rl 'verisimdb\|VeriSimDB' --include='*.toml' --include='*.yaml' --include='*.yml' --include='*.json' --include='*.rs' --include='*.ex' . 2>/dev/null | head -1 | grep -q .; then
            SCORE=$((SCORE + 1))
            VSDB_STATUS=":white_check_mark:"
          else
            VSDB_STATUS=":ballot_box_with_check:"
          fi

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Dogfooding Scorecard

          **Score: ${SCORE}/${MAX}**

          | Tool/Format | Status | Notes |
          |-------------|--------|-------|
          | A2ML manifest (0-AI-MANIFEST.a2ml) | ${A2ML_STATUS} | Required for all RSR repos |
          | K9 contracts | ${K9_STATUS} | Required for repos with config files |
          | .editorconfig | ${EC_STATUS} | Required for all repos |
          | Groove endpoint | ${GROOVE_STATUS} | Required for service repos |
          | VeriSimDB integration | ${VSDB_STATUS} | Required for stateful repos |

          ---
          *Generated by the [Dogfood Gate](https://github.com/hyperpolymath/rsr-template-repo) workflow.*
          *Dogfooding is guinea pig fooding — we test our tools on ourselves.*
          EOF
