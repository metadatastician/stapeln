# SPDX-License-Identifier: MPL-2.0
#
# Repository settings for probot/settings GitHub App.
# https://github.com/probot/settings
#
# This file defines repository-level configuration that is automatically
# applied by the probot/settings app when changes are pushed to the default
# branch. Install the app at: https://github.com/apps/settings
#
# ─── What this file deliberately does NOT contain ─────────────────────────────
#
# 1. A `branches:` / branch-protection block.
#
#    This repository's default branch is governed by ACTIVE rulesets, not by
#    classic branch protection:
#
#      23868655  Branch-Floor            (org)   deletion, non-fast-forward,
#                                                 linear history, secret-scanning
#                                                 alert resolution
#      18225024  EstateBranching         (org)   required_signatures, pull_request,
#                                                 copilot_code_review
#      24634124  Branch-Signatures       (org)   required_signatures
#      24310272  Secret-Scan-Floor       (repo)  required check: "scan / gitleaks"
#
#    A copied `branches:` block here would be stale the moment the estate
#    rulesets change, and probot/settings would race them. The rulesets are
#    authoritative; verify with:
#
#       gh api repos/metadatastician/stapeln/rulesets
#
#    NOTE: the previously-present block also required signatures via
#    `required_signatures: true` while listing a `restrictions: null` — that
#    classic-protection shape is what the rulesets above replaced.
#
# 2. A `labels:` block.
#
#    Labels are owned by `.github/labels.json`, applied by the dependency-free
#    `.github/workflows/labels.yml` sync (which deliberately has no `uses:`, so
#    it needs no actions.lock entry). A second label list here drifted from
#    that one in name, colour and description — e.g. `security` was `e4e669`
#    here and `006b75` there, and 11 labels existed only in this file while 32
#    existed only in labels.json. Two authorities for one set is the bug; the
#    JSON file plus its workflow is the surviving one.

# ─── Repository Settings ───────────────────────────────────────────────────────
#
# Values below are the repo's LIVE state (verified against
# `gh repo view metadatastician/stapeln --json …`), so applying this file is a
# no-op rather than a surprise rewrite.

repository:
  name: "stapeln"
  description: "Visual Podman-only container topology designer and deployment compiler that validates stacks, models security gaps, and emits deployment bundles through a formally typed ABI."
  # No homepage URL is set on the repository; publishing the old
  # paint-type URL here would have sent visitors to another project.
  private: false
  has_issues: true
  has_projects: true
  has_wiki: true
  has_discussions: true
  has_downloads: false
  default_branch: main
  # Live state: squash-only. The previous `allow_merge_commit: true` and
  # `allow_rebase_merge: true` disagreed with the repository and with the
  # org `EstateBranching` ruleset, whose `allowed_merge_methods` are
  # ["squash", "rebase"] — enabling merge commits here would contradict it.
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  allow_auto_merge: true
  delete_branch_on_merge: true
  allow_update_branch: true
  web_commit_signoff_required: true
  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true
