# SPDX-License-Identifier: MPL-2.0
# Dependabot configuration for RSR-compliant repositories
# Trimmed and repointed to the ecosystems/directories actually present:
#   - Elixir/Mix app at /backend (backend/mix.exs)
#   - JS frontend toolchain at /frontend (frontend/package.json)
# cargo (only a nested reference implementation under verified-container-spec/)
# and dom-mounter/package.json are intentionally unmanaged; pip (banned
# estate-wide) and nix have no manifests. Declaring mix/npm at "/" — where no
# manifest exists — only produced red "Dependabot Updates" runs.

version: 2
updates:
  # GitHub Actions - always include
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # Elixir/Mix (backend application)
  - package-ecosystem: "mix"
    directory: "/backend"
    schedule:
      interval: "weekly"
    # Security-only, matching the estate cargo pattern: suppress routine
    # version-update PRs while leaving Dependabot SECURITY PRs flowing.
    open-pull-requests-limit: 0

  # Node.js/npm (frontend toolchain)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
