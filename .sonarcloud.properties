# SPDX-License-Identifier: MPL-2.0
#
# SonarQube Cloud - additional analysis configuration.
#
# This repository is analysed by SonarQube Cloud AUTOMATIC ANALYSIS: there is no
# scanner workflow in .github/workflows, the analysis is driven by the GitHub
# App. Automatic analysis reads `.sonarcloud.properties` from the repository
# root and IGNORES `sonar-project.properties`, which is a CI-based-analysis
# file. That is why this file carries this name and lives here.
#   https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis
#
# ---------------------------------------------------------------------------
# Why sonar.exclusions and not sonar.cpd.exclusions
# ---------------------------------------------------------------------------
# frontend/src/*.res.js is COMPILER OUTPUT. The ReScript compiler emits it from
# the adjacent frontend/src/*.res sources, and those sources stay fully
# analysed - they are the code a human writes, reviews and can act on.
#
# sonar.cpd.exclusions would suppress only the copy-paste detector and leave
# every other rule pointed at generated JavaScript. That yields findings nobody
# can act on: the remedy for a defect in generated output is never to edit the
# output, it is to edit the .res source or the compiler. For GENERATED code the
# honest configuration is to take it out of analysis entirely, which is what
# sonar.exclusions does, and which also keeps duplication density a measure of
# hand-written code.
#
# This narrows what is analysed; it does not silence a real defect. Nothing
# hand-written is excluded.
#
# ---------------------------------------------------------------------------
# Scope note - deliberately NOT excluded
# ---------------------------------------------------------------------------
# Generated .res.js also exists in frontend/lib/bs/src (30 files) and
# dom-mounter/src (9 files). Neither contributes a single duplicated line to the
# current new-code period, so excluding them would remove code from analysis
# without any measurement saying it needs removing. Extend the list below only
# against a measurement, never pre-emptively.
#
# ---------------------------------------------------------------------------
# Pattern semantics
# ---------------------------------------------------------------------------
# `**` matches ZERO or more directory segments, so frontend/src/**/*.res.js does
# match frontend/src/App.res.js even though there is no intermediate directory.
# The "wildcards are not allowed" restriction in the automatic-analysis docs
# applies to sonar.sources and sonar.tests only - not to sonar.exclusions.
#
# *.res.mjs is listed for forward safety: this repository currently has ZERO
# such files, but the ReScript compiler emits that extension under an ESM
# configuration and the exclusion should not silently lapse if that changes.

sonar.exclusions=frontend/src/**/*.res.js,frontend/src/**/*.res.mjs
