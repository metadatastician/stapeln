# SPDX-License-Identifier: MPL-2.0
#
# SonarCloud configuration for stapeln.
#
# -- Why githubactions:S7637 is excluded for .github/workflows/ ---------------
#
# S7637 ("Use full commit SHA hash for this dependency") wants every `uses:`
# ref written as a 40-character commit SHA. Its intent -- never resolve an
# action through a mutable tag that could be repointed at hostile code -- is
# correct, and it is ALREADY SATISFIED HERE by a stronger mechanism.
#
# This repository pins through `.github/workflows/actions.lock`, generated by
# `gh actions-lock`, which in its own words:
#
#     Actions are resolved by mutable tags and branches at runtime. This
#     extension pins every direct and transitive dependency to an immutable
#     commit SHA in a per-repo lockfile at .github/workflows/actions.lock,
#     so changes are visible in pull request diffs and tampered or hijacked
#     actions are caught before they run.
#
# Two things make this stronger than inline SHAs rather than weaker:
#
#   1. It covers TRANSITIVE dependencies. An inline SHA pins the action you
#      name; it does nothing about the actions that action itself calls.
#   2. It is ENFORCED AT RUNTIME, not merely recorded. Measured: when
#      dependabot bumped codeql-action to v4.37.6 in the workflow while the
#      lockfile still recorded v4.37.3, GitHub REJECTED the workflow before
#      running any job (a zero-job `startup_failure`) until the lockfile was
#      regenerated. A drifting or tampered ref cannot execute.
#
# The two mechanisms are also mutually exclusive in practice: `gh actions-lock`
# normalises `uses:` refs back to tag form and records the resolved SHA in the
# lockfile, so an inline SHA does not survive the next run of the estate's own
# tooling. Complying with S7637 literally would mean abandoning the lockfile.
#
# This is the same class of finding as the scorecard `DependencyPinning` rule
# baselined in .hypatia-baseline.json: a linter that is not lockfile-aware
# flagging a repo that pins more thoroughly than the rule contemplates.
#
# NARROWLY SCOPED ON PURPOSE: one rule, one directory. If an action is ever
# referenced from outside .github/workflows/, S7637 still applies to it.
# Revisit if S7637 becomes lockfile-aware.

sonar.issue.ignore.multicriteria=lockfilepin
sonar.issue.ignore.multicriteria.lockfilepin.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.lockfilepin.resourceKey=.github/workflows/**
